.ov{background:rgba(10,12,14,.6)}

#pl{left:.6em}#pr{right:.6em}
.pad button{margin:0;padding:0;width:3.6em;height:3.6em;border-radius:50%;border:.17em solid rgba(241,237,228,.9);background:rgba(10,12,14,.45);color:#f1ede4;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-tap-highlight-color:transparent}

<script>

};
const RU_LIKE=['ru','be','kk','uk','uz','tg','hy','az','ka','ky','tk','mo'];
let LANG='en';
const T=k=>I18N[LANG][k];
const pickLang=c=>RU_LIKE.includes(String(c||'').toLowerCase().slice(0,2))?'ru':'en';
LANG=pickLang(navigator.language||'en');
const cv=document.getElementById('c'),cx=cv.getContext('2d'),box=document.getElementById('box'),
ov=document.getElementById('ov'),ot=document.getElementById('ot'),op=document.getElementById('op'),
ob=document.getElementById('ob'),sb=document.getElementById('snd');
const W=400,RX=40,LW=80,K=3,FONT='"Segoe UI",Roboto,Arial,sans-serif';
let H=700,PY=800,SW=400,SH=700,LAND=false;
const CB=260,HBX={sedan:44,suv:58,truck:88,fura:104};
let camX=200,ZC=950,HZ=80,FOC=224,CAMH=155,K1=34800;
const laneX=i=>RX+LW*i+LW/2;
const LV=[70,62,54,46]; // скорость потока по полосам, км/ч
const COL=['#c9c9c4','#8f2a2a','#d9b13b','#3f7a58','#d6d1c4','#6a5a9c','#2b2f36'];
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
let st='menu',speed,dist,bonus,cars,p,off,spawn,pops,shake,best=0,k=1,keyL=0,keyR=0,touch=0,last=0;
let ac,eo,fl,eg,muted=false,braking=false,keyB=0,brkHold=0,sid=-1,keyG=0,gasHold=0,cd=0,go=0,hornT=0,hornCd=0,lastHonk=0;
const IMG=n=>{const i=new Image();i.src=n;return i};
const PRE=['#ffffff','#d11a1a','#f0b800','#2f6df0','#2a2a2a','#1fa05a'],RED='#d11a1a'; // белый, красный, жёлтый, синий, чёрный, зелёный
let carCol=RED;try{const v=localStorage.getItem('mag_col');if(/^#[0-9a-f]{6}$/i.test(v))carCol=v.toLowerCase()}catch(e){}
const baseImg=typeof CAR!=='undefined'?IMG(CAR.src):new Image(),HX=typeof CAR!=='undefined'?CAR.hx:.33,HY=typeof CAR!=='undefined'?CAR.hy:.11,asphalt=IMG('assets/asphalt.jpg'),grass=IMG('assets/grass.jpg');
const ok=i=>i.complete&&i.naturalWidth>0;
const SPR={},TY={sedan:{w:40,h:90},suv:{w:42,h:98},truck:{w:44,h:132},fura:{w:46,h:210}};
const LIGHT=['#dfe2e6','#c9d2dc','#e8dfc8','#b7c6d6'];
function sh(c,f){const n=parseInt(c.slice(1),16),t=f<0?0:255,a=Math.abs(f),m=v=>Math.round(v+(t-v)*a);return 'rgb('+m(n>>16)+','+m(n>>8&255)+','+m(n&255)+')'}
function rp(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function sprite(type,col,cab,w,h){
  const key=type+col+cab;if(SPR[key])return SPR[key];
  const S=3,c=document.createElement('canvas');c.width=(w+10)*S;c.height=(h+10)*S;
  const g=c.getContext('2d');g.scale(S,S);g.translate((w+10)/2,(h+10)/2);
  const body=(x,y,a,b,r,cl)=>{const q=g.createLinearGradient(x,0,x+a,0);
    q.addColorStop(0,sh(cl,-.4));q.addColorStop(.3,sh(cl,.1));q.addColorStop(.55,sh(cl,.22));q.addColorStop(1,sh(cl,-.4));
    g.fillStyle=q;rp(g,x,y,a,b,r);g.fill()};
  const glass=(x,y,a,b,r)=>{const q=g.createLinearGradient(0,y,0,y+b);q.addColorStop(0,'#2a3744');q.addColorStop(1,'#0a0e13');
    g.fillStyle=q;rp(g,x,y,a,b,r);g.fill();g.fillStyle='rgba(255,255,255,.14)';
    g.beginPath();g.moveTo(x+2,y+b*.5);g.lineTo(x+a*.55,y+2);g.lineTo(x+a*.8,y+2);g.lineTo(x+2,y+b*.85);g.fill()};
  g.fillStyle='rgba(0,0,0,.4)';rp(g,-w/2+2,-h/2+4,w,h,8);g.fill();
  if(type==='truck'||type==='fura'){
    const cb=type==='fura'?h*.15:h*.24,top=-h/2,bt=top+cb+4;
    body(-w/2+1,top,w-2,cb,6,cab);glass(-w/2+5,top+4,w-10,cb*.4,3);
    g.fillStyle='#16181c';g.fillRect(-4,top+cb-1,8,6);
    body(-w/2,bt,w,h-cb-4,3,col);
    g.strokeStyle='rgba(0,0,0,.14)';g.lineWidth=.8;
    for(let y=bt+10;y<h/2-4;y+=13){g.beginPath();g.moveTo(-w/2+2,y);g.lineTo(w/2-2,y);g.stroke()}
    g.fillStyle='rgba(255,255,255,.22)';g.fillRect(-w/2+5,bt+3,w*.16,h-cb-12);
  }else{
    const sv=type==='suv';
    g.fillStyle='#0b0b0d';
    for(const y of[-h*.3,h*.25]){g.fillRect(-w/2-1.5,y,3.5,h*.15);g.fillRect(w/2-2,y,3.5,h*.15)}
    body(-w/2,-h/2,w,h,w*.3,col);
    g.strokeStyle='rgba(0,0,0,.22)';g.lineWidth=.7;g.beginPath();
    g.moveTo(-w*.2,-h/2+4);g.lineTo(-w*.22,-h*.2);g.moveTo(w*.2,-h/2+4);g.lineTo(w*.22,-h*.2);g.stroke();
    glass(-w/2+4,sv?-h*.2:-h*.17,w-8,sv?h*.56:h*.46,6);
    body(-w/2+6,sv?-h*.08:-h*.04,w-12,sv?h*.36:h*.22,4,col);
    g.fillStyle=sh(col,-.3);rp(g,-w/2-3.5,-h*.15,4.5,5,2);g.fill();rp(g,w/2-1,-h*.15,4.5,5,2);g.fill();
  }
  g.fillStyle='#fff7d0';rp(g,-w/2+3,-h/2+1.5,8,3.5,1.5);g.fill();rp(g,w/2-11,-h/2+1.5,8,3.5,1.5);g.fill();
  g.fillStyle='#ff2a22';rp(g,-w/2+3,h/2-4.5,9,3,1.5);g.fill();rp(g,w/2-12,h/2-4.5,9,3,1.5);g.fill();
  return SPR[key]=c;
}
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
  if(d){h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6}
  return[h,mx?d/mx:0,mx]}
function hsv2rgb(h,s,v){const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
  return[[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i%6].map(x=>Math.round(x*255))}
const RC={};
function carFor(hex){
  hex=hex.toLowerCase();
  if(!ok(baseImg))return null;
  if(hex===RED)return baseImg;
  if(RC[hex])return RC[hex];
  try{
    const w=baseImg.naturalWidth,h=baseImg.naturalHeight,c=document.createElement('canvas');c.width=w;c.height=h;
    const g=c.getContext('2d');g.drawImage(baseImg,0,0);const d=g.getImageData(0,0,w,h),a=d.data;
    const n=parseInt(hex.slice(1),16),[th,ts,tv]=rgb2hsv(n>>16&255,n>>8&255,n&255);
    for(let i=0;i<a.length;i+=4){
      if(!a[i+3])continue;
      const[hh,s,v]=rgb2hsv(a[i],a[i+1],a[i+2]);
      if(s>.4&&v>.07&&(hh<.06||hh>.94)){
        const ns=Math.min(1,s*ts/.9),nv=Math.min(1,v*tv+(1-v)*.35*tv*(1-ts)),o=hsv2rgb(th,ns,nv);
        a[i]=o[0];a[i+1]=o[1];a[i+2]=o[2];
      }
    }
    g.putImageData(d,0,0);return RC[hex]=c;
  }catch(e){return baseImg}
}
const T3=typeof CAR3D!=='undefined'&&CAR3D.spr?{s:IMG(CAR3D.spr),m:IMG(CAR3D.mk)}:null,PHT=38;let PTC={};
function tint(im,mk,hex,nrm){
  const w=im.naturalWidth,h=im.naturalHeight,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.drawImage(im,0,0);if(!hex)return c;
  const d=g.getImageData(0,0,w,h),a=d.data,m2=document.createElement('canvas');m2.width=w;m2.height=h;const mg=m2.getContext('2d');
  mg.drawImage(mk,0,0);const m=mg.getImageData(0,0,w,h).data,n=parseInt(hex.slice(1),16),cc=[n>>16&255,n>>8&255,n&255];
  for(let i=0;i<a.length;i+=4){
    const q=m[i]/255;if(!q||!a[i+3])continue;
    const v=Math.max(a[i],a[i+1],a[i+2])/255,f=Math.min(1,v/nrm),hl=v>nrm?(v-nrm)/(1-nrm)*.5:0;
    for(let j=0;j<3;j++){const o=cc[j]*(.28+.72*f)+(255-cc[j])*hl;a[i+j]=a[i+j]*(1-q)+o*q}
  }
  g.putImageData(d,0,0);return c;
}
function plTex(hex){
  if(!T3||!ok(T3.s)||!ok(T3.m))return null;
  hex=hex.toLowerCase();if(PTC[hex])return PTC[hex];
  if(Object.keys(PTC).length>6)PTC={};
  return PTC[hex]=tint(T3.s,T3.m,hex,.9);
}
function spriteCar(c){
  const g=P(p.x,PY,0),r=FOC/400,k=CAR3D.k,x0=g[0]-CAR3D.ax/k*r,y0=g[1]-CAR3D.ay/k*r;
  quad(P(p.x-20,PY+46,0),P(p.x+20,PY+46,0),P(p.x+21,PY-44,0),P(p.x-21,PY-44,0),'rgba(0,0,0,.3)');
  cx.drawImage(c,x0,y0,c.width/k*r,c.height/k*r);
  const glow=(pt,rad,c0)=>{const X=x0+pt[0]/k*r,Y=y0+pt[1]/k*r,R=rad*r,gr=cx.createRadialGradient(X,Y,0,X,Y,R);gr.addColorStop(0,c0);gr.addColorStop(1,'rgba(255,255,255,0)');cx.fillStyle=gr;cx.fillRect(X-R,Y-R,R*2,R*2)};
  if(braking)for(const t of CAR3D.tl)glow(t,13,'rgba(255,50,35,.95)');
  if(hornT>0)for(const t of CAR3D.hl)glow(t,16,'rgba(255,252,225,1)');
}
function drawPlayer(){
  const im=carFor(carCol),good=!!im,PW=44,PH=good?PW*im.height/im.width:90;
  cx.save();cx.translate(p.x,p.y);cx.rotate(p.vx/270*.08);
  cx.fillStyle='rgba(0,0,0,.35)';rp(cx,-PW/2+3,-PH/2+5,PW-4,PH,10);cx.fill();
  if(good)cx.drawImage(im,-PW/2,-PH/2,PW,PH);
  else cx.drawImage(sprite('sedan',carCol,carCol,40,90),-25,-50,50,100);
  if(hornT>0)for(const sx of[-1,1]){
    const gx=sx*PW*HX,gy=-PH/2+PH*HY,gr=cx.createRadialGradient(gx,gy,0,gx,gy,14);
    gr.addColorStop(0,'rgba(255,252,225,1)');gr.addColorStop(.35,'rgba(255,246,200,.7)');gr.addColorStop(1,'rgba(255,240,180,0)');
    cx.fillStyle=gr;cx.fillRect(gx-14,gy-14,28,28);
  }
  if(braking)for(const sx of[-1,1]){
    const gr=cx.createRadialGradient(sx*PW*.3,PH/2-4,0,sx*PW*.3,PH/2-4,10);
    gr.addColorStop(0,'rgba(255,60,40,.95)');gr.addColorStop(1,'rgba(255,40,30,0)');
    cx.fillStyle=gr;cx.fillRect(sx*PW*.3-10,PH/2-14,20,20);
  }
  cx.restore();

try{best=+localStorage.getItem('mag_best')||0}catch(e){}

const score=()=>Math.floor(dist/10)+bonus;
function reset(){speed=20;dist=0;hornT=0;bonus=0;cars=[];pops=[];off=0;spawn=.4;shake=0;p={x:laneX(1),y:PY,w:36,h:88,vx:0}}
function show(t,h,b){ot.textContent=t;op.innerHTML=h;ob.textContent=b;ov.classList.remove('hide');ob.focus({preventScroll:true})}
function fit(){
  LAND=true;SH=400;SW=Math.max(640,Math.min(900,Math.round(400*innerWidth/innerHeight)));   // игра всегда горизонтальная
  HZ=-SH*.3;FOC=SW*.5;K1=(SH*.92-HZ)*(CB-52);CAMH=K1/FOC;ZC=PY+CB;
  const s=Math.min(innerWidth/SW,innerHeight/SH),dpr=Math.min(devicePixelRatio||1,2);
  box.style.width=SW*s+'px';box.style.height=SH*s+'px';box.style.fontSize=16*s+'px';box.className='';
  cv.style.width=SW*s+'px';cv.style.height=SH*s+'px';
  cv.width=SW*s*dpr;cv.height=SH*s*dpr;k=cv.width/SW;
}
addEventListener('resize',fit);

/* ---------- звук ---------- */
function audioInit(){
  if(!ac){
    try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
    const o1=ac.createOscillator(),o2=ac.createOscillator();
    o1.type='sawtooth';o2.type='square';
    fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=600;
    eg=ac.createGain();eg.gain.value=0;
    o1.connect(fl);o2.connect(fl);fl.connect(eg).connect(ac.destination);
    o1.start();o2.start();eo=[o1,o2];loadSamples();loadHorn();
  }
  if(ac.state==='suspended')ac.resume();

  if(st==='count'){cd-=dt;speed=20;braking=false;if(cd<=0){st='play';go=.9}}

    speed=braking?Math.max(20,speed-95*dt):(keyG||gasHold)?Math.min(300,speed+(48-speed*.13)*dt):Math.max(20,speed-(4+speed*.03)*dt)}

  for(const c of cars){

    if(!c.pass&&c.y>p.y){

const lp=(a,b,t)=>a+(b-a)*t;
function bx(x0,x1,y0,y1,z0,z1,col,topc){
  if(camX>x1)quad(P(x1,y1,z0),P(x1,y0,z0),P(x1,y0,z1),P(x1,y1,z1),sh(col,-.45));
  else if(camX<x0)quad(P(x0,y1,z0),P(x0,y0,z0),P(x0,y0,z1),P(x0,y1,z1),sh(col,-.45));
  quad(P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1),sh(col,-.25));
  quad(P(x0,y1,z1),P(x1,y1,z1),P(x1,y0,z1),P(x0,y0,z1),topc||sh(col,.1));
}
function rface(x0,x1,y,z0,z1){return(u0,u1,v0,v1,f)=>quad(P(lp(x0,x1,u0),y,lp(z0,z1,v0)),P(lp(x0,x1,u1),y,lp(z0,z1,v0)),P(lp(x0,x1,u1),y,lp(z0,z1,v1)),P(lp(x0,x1,u0),y,lp(z0,z1,v1)),f)}
function cabin(x,y0b,y1b,y0t,y1t,xb,xt,z0,z1,col){
  const sg=camX>x+xb?1:camX<x-xb?-1:0;
  if(sg){const S=(u,v)=>P(x+sg*lp(xb,xt,v),lp(lp(y0b,y1b,u),lp(y0t,y1t,u),v),lp(z0,z1,v));
    quad(S(0,0),S(1,0),S(1,1),S(0,1),sh(col,-.45));quad(S(.1,.16),S(.92,.16),S(.82,.86),S(.2,.86),'#0c1117')}
  const G=(u,v)=>P(x+lp(lp(-xb,xb,u),lp(-xt,xt,u),v),lp(y1b,y1t,v),lp(z0,z1,v));
  quad(G(0,0),G(1,0),G(1,1),G(0,1),sh(col,-.25));
  quad(G(.08,.12),G(.92,.12),G(.86,.88),G(.14,.88),'#0c1117');
  quad(G(.14,.45),G(.42,.45),G(.34,.88),G(.14,.88),'rgba(255,255,255,.13)');
  quad(P(x-xt,y1t,z1),P(x+xt,y1t,z1),P(x+xt,y0t,z1),P(x-xt,y0t,z1),sh(col,.16));
}
const TS={};if(typeof TRAF!=='undefined')TRAF.forEach(s=>{s.img=IMG(s.src);(TS[s.type]=TS[s.type]||[]).push(s)});
function spriteTraffic(c){
  const s=c.sp;if(ZC-(c.y+c.h/2)<14)return;
  const g=P(c.x,c.y,0),r=FOC/(ZC-c.y)/.8,k=s.k,x0=g[0]-s.ax/k*r,y0=g[1]-s.ay/k*r;
  quad(P(c.x-c.w/2-1,c.y+c.h/2,0),P(c.x+c.w/2+1,c.y+c.h/2,0),P(c.x+c.w/2,c.y-c.h/2,0),P(c.x-c.w/2,c.y-c.h/2,0),'rgba(0,0,0,.3)');
  cx.drawImage(s.img,x0,y0,s.w/k*r,s.h/k*r);
  if(c.v<c.v0-.5)for(const t of s.tl){const X=x0+t[0]/k*r,Y=y0+t[1]/k*r,R=9*r,gr=cx.createRadialGradient(X,Y,0,X,Y,R);gr.addColorStop(0,'rgba(255,50,35,.95)');gr.addColorStop(1,'rgba(255,40,30,0)');cx.fillStyle=gr;cx.fillRect(X-R,Y-R,R*2,R*2)}
}
function veh2(c){
  const{x,y,w,type,col,cab}=c,len=c.h,xl=x-w/2,xr=x+w/2,yf=y-len/2,yr=y+len/2;
  if(ZC-yr<14)return;
  const Y=u=>yf+len*u,big=type==='truck'||type==='fura',tlc=c.v<c.v0-.5?'#ff3b30':'#a8160f';
  const A=P(xl,yr,0),B=P(xr,yr,0),C=P(xr,yf,0),D=P(xl,yf,0);
  quad([A[0]-4,A[1]+2],[B[0]+4,B[1]+2],[C[0]+3,C[1]],[D[0]-3,D[1]],'rgba(0,0,0,.4)');
  const wh=us=>{for(const u of us)for(const sx of[xl-1,xr-5])bx(sx,sx+6,Y(u)-len*(big?.05:.085),Y(u)+len*(big?.05:.085),0,big?15:13,'#0d0e10','#1a1b1e')};
  if(!big){
    const sv=type==='suv',z1=sv?22:17;
    wh([.2,.8]);bx(xl,xr,yf,yr,3,z1,col);
    const R=rface(xl,xr,yr,3,z1);
    R(0,1,0,.28,sh(col,-.62));R(.03,.27,.5,.88,tlc);R(.73,.97,.5,.88,tlc);R(.38,.62,.3,.56,'#e7e4d8');R(.12,.2,.04,.2,'#111');R(.8,.88,.04,.2,'#111');
    if(sv)cabin(x,Y(.2),Y(.97),Y(.25),Y(.93),w/2-2,w/2-4,z1,41,col);
    else cabin(x,Y(.3),Y(.8),Y(.42),Y(.63),w/2-3,w/2-8,z1,31,col);
  }else{
    const f=type==='fura',zc=f?62:54,zb=f?106:80,cu=f?.16:.26,bu=f?.185:.285;
    wh(f?[.1,.8,.9]:[.12,.82,.92]);
    bx(xl+4,xr-4,yf,yr,2,8,'#25272b');
    bx(xl+2,xr-2,yf,Y(cu),5,zc,cab);
    bx(xl,xr,Y(bu),yr,8,zb,col);
    const R=rface(xl,xr,yr,8,zb);
    R(.495,.505,.1,1,'rgba(0,0,0,.3)');R(0,1,0,.07,sh(col,-.6));R(.03,.17,.09,.19,tlc);R(.83,.97,.09,.19,tlc);R(.42,.58,.2,.28,'#e7e4d8');
  }
}
function tree(x,y){
  const Z=ZC-y;if(Z<30)return;
  const b=P(x,y,0),t=P(x,y,52),c=P(x,y,95),sc=FOC/Z;
  cx.fillStyle='rgba(0,0,0,.25)';cx.beginPath();cx.ellipse(b[0]+6*sc,b[1],34*sc,9*sc,0,0,7);cx.fill();
  cx.fillStyle='#4a3a28';cx.fillRect(b[0]-4*sc,t[1],8*sc,b[1]-t[1]);
  cx.fillStyle='#5a7a2a';cx.beginPath();cx.arc(c[0],c[1],36*sc,0,7);cx.fill();
  cx.fillStyle='#7a9a3a';cx.beginPath();cx.arc(c[0]-8*sc,c[1]-8*sc,20*sc,0,7);cx.fill();
}
function draw(){
  cx.setTransform(k,0,0,k,0,0);
  camX=200+(p.x-200)*.55;
  const sg=cx.createLinearGradient(0,0,0,HZ);sg.addColorStop(0,'#3f6fa3');sg.addColorStop(1,'#bcd2e6');
  cx.fillStyle=sg;cx.fillRect(0,0,SW,HZ+2);
  cx.save();
  if(shake>0)cx.translate((Math.random()-.5)*20*shake,(Math.random()-.5)*20*shake);
  const q=calm||st!=='play'?0:Math.max(0,Math.min(1,(speed-250)/50));
  if(q>0)cx.translate((Math.random()-.5)*6*q,(Math.random()-.5)*6*q);
  const bq=st==='play'?Math.max(0,Math.min(1,(speed-250)/35)):0;
  for(let sy=Math.max(0,Math.ceil(HZ)+1);sy<SH;sy+=2){
    const Z=K1/(sy-HZ),sc=FOC/Z,v=(((ZC-Z-off)%256)+256)%256,xa=camX-SW/2/sc,xb=camX+SW/2/sc;
    if(ok(grass))strip(grass,xa,xb,sy,Z,sc,v);else{cx.fillStyle='#4a6f2b';cx.fillRect(0,sy,SW,2)}
    if(ok(asphalt))strip(asphalt,RX,RX+320,sy,Z,sc,v,xa,xb);else{cx.fillStyle='#3a3c40';cx.fillRect(SW/2+(RX-camX)*sc,sy,320*sc,2)}
  }
  const hz=cx.createLinearGradient(0,0,0,SH*.3);hz.addColorStop(0,'rgba(188,210,230,.55)');hz.addColorStop(1,'rgba(188,210,230,0)');
  cx.fillStyle=hz;cx.fillRect(0,0,SW,SH*.3);
  const yN=ZC-14,yF=-1000;
  for(const xe of[RX-8,RX+328]){quad(P(xe,yN,0),P(xe,yF,0),P(xe,yF,13),P(xe,yN,13),'#8e959c');quad(P(xe,yN,11),P(xe,yF,11),P(xe,yF,14),P(xe,yN,14),'#c9ced3')}
  for(const xe of[RX+4,RX+316])quad(P(xe-2,yN,0),P(xe-2,yF,0),P(xe+2,yF,0),P(xe+2,yN,0),'#e8e4d8');
  for(let i=1;i<4;i++){const xe=RX+i*LW;
    for(let y=-1000+off%80;y<yN;y+=80){const y1=Math.min(y+40,yN);quad(P(xe-1.5,y1,0),P(xe-1.5,y,0),P(xe+1.5,y,0),P(xe+1.5,y1,0),'#e8e4d8')}}
  const tr=[];for(let i=0;i<14;i++)tr.push([((i*131+off)%1700)-900,i%2?470+(i*53%90):-70-(i*37%90)]);
  tr.sort((a,b)=>a[0]-b[0]);tr.forEach(t=>tree(t[1],t[0]));
  {const n=P(p.x,PY-45,0),f=P(p.x,PY-320,0),g=cx.createLinearGradient(0,n[1],0,f[1]);
   g.addColorStop(0,'rgba(255,246,201,'+(hornT>0?.55:.1)+')');g.addColorStop(1,'rgba(255,246,201,0)');
   quad(P(p.x-22,PY-45,0),P(p.x+22,PY-45,0),P(p.x+70,PY-320,0),P(p.x-70,PY-320,0),g)}
  const im=carFor(carCol),dl=[[PY,()=>{
    if(im)vehicle(p.x,PY,44,44*im.height/im.width,PHT,carCol,im,0,0,im.width,im.height,true);
    else vehicle(p.x,PY,40,90,38,carCol,sprite('sedan',carCol,carCol,40,90),15,15,120,270,true);
  }]];
  cars.forEach(c=>dl.push([c.y,()=>c.sp&&ok(c.sp.img)?spriteTraffic(c):veh2(c)]));
  dl.sort((a,b)=>a[0]-b[0]);dl.forEach(o=>o[1]());
  cx.restore();
  if(bq>0){
    cx.globalAlpha=.25*bq;cx.drawImage(cv,0,0,cv.width,cv.height,0,-9*bq,SW,SH);cx.globalAlpha=1;
    softBlur(.5*bq);
    cx.strokeStyle='rgba(255,255,255,'+.16*bq+')';cx.lineWidth=1.5;
    for(let i=0;i<26;i++){
      const ang=Math.PI*(.06+.88*((i*.618)%1)),t=((i*.173)+off*.0011)%1,r0=40+t*t*SW*.7,r1=r0+(25+90*t)*bq;
      cx.beginPath();cx.moveTo(SW/2+Math.cos(ang)*r0*1.5,HZ+Math.sin(ang)*r0);cx.lineTo(SW/2+Math.cos(ang)*r1*1.5,HZ+Math.sin(ang)*r1);cx.stroke();
    }
    const vg=cx.createRadialGradient(SW/2,SH/2,Math.min(SW,SH)*.45,SW/2,SH/2,Math.max(SW,SH)*.75);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,'+.4*bq+')');cx.fillStyle=vg;cx.fillRect(0,0,SW,SH);
  }
  cx.shadowColor='rgba(0,0,0,.65)';cx.shadowBlur=4;
  cx.textAlign='left';cx.fillStyle='#f1ede4';cx.font='700 24px '+FONT;cx.fillText(score(),14,34);
  cx.textAlign='center';cx.font='italic 800 30px '+FONT;cx.fillText(Math.round(speed)+' '+T('kmh'),SW/2,34);
  cx.textAlign='right';cx.font='600 13px '+FONT;cx.fillStyle='rgba(241,237,228,.9)';cx.fillText(T('best')+' '+best,SW-14,32);
  cx.textAlign='center';cx.font='800 22px '+FONT;
  for(const o of pops){cx.globalAlpha=Math.min(1,o.t*2);cx.fillStyle='#ff8a2a';cx.fillText(o.s,SW/2,SH*.45-(1.1-o.t)*40)}
  cx.globalAlpha=1;
  if(st==='count'||go>0){
    const t=st==='count'?String(Math.ceil(cd)):T('go');
    cx.font='italic 800 96px '+FONT;cx.lineWidth=6;cx.strokeStyle='rgba(0,0,0,.5)';
    cx.strokeText(t,SW/2,SH*.42);cx.fillStyle=st==='count'?'#f1ede4':'#ff8a2a';cx.fillText(t,SW/2,SH*.42);
  }
  cx.shadowBlur=0;
}
function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(st==='play'||st==='count')update(dt);else if(st==='menu')off+=180*dt;
  if(shake>0)shake-=dt;
  engine();draw();requestAnimationFrame(loop);
}

/* ---------- управление ---------- */
function start(){reset();st='count';cd=3;ov.classList.add('hide');gp(true)}
function pause(){if(st==='play'){st='pause';gp(false);show(T('pause'),T('paused'),T('resume'))}}
function goLandscape(){
  if(!matchMedia('(pointer:coarse)').matches)return;
  try{
    const e=document.documentElement,rq=e.requestFullscreen||e.webkitRequestFullscreen;
    const lock=()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(x){}};
    const pr=rq&&!document.fullscreenElement?rq.call(e):null;
    if(pr&&pr.then)pr.then(lock).catch(()=>{});else lock();
  }catch(x){}
}
ob.addEventListener('click',()=>{
  if(adBusy)return;
  goLandscape();audioInit();
  if(st==='pause'){st='play';ov.classList.add('hide');gp(true)}
  else if(st==='over'&&ysdk&&ysdk.adv)showAd(start);
  else start();
});
sb.addEventListener('click',toggleMute);
function act(c){
  const m=c==='ArrowLeft'||c==='KeyA'?0:c==='ArrowRight'||c==='KeyD'?1:c==='ArrowUp'||c==='KeyW'?2:c==='ArrowDown'||c==='KeyS'?3:-1;
  return m<0?'':'LRGB'[m];
}
function setKey(a,v){if(a==='L')keyL=v;else if(a==='R')keyR=v;else if(a==='G')keyG=v;else keyB=v}
addEventListener('keydown',e=>{
  const c=e.code,a=act(c);
  if(a)setKey(a,1);
  else if(c==='KeyH'||c==='Space'){if(!e.repeat)honk()}
  else if(c==='KeyM')toggleMute();
  else if(c==='KeyP'||c==='Escape')pause();
  if(c.startsWith('Arrow')||(c==='Space'&&st==='play'))e.preventDefault();
});
addEventListener('keyup',e=>{const a=act(e.code);if(a)setKey(a,0)});
const side=e=>{const r=box.getBoundingClientRect();touch=(e.clientX-r.left)<r.width/2?-1:1};
let bL=0,bR=0;
function hold(id,on,off){const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{on();b.classList.add('dn');e.preventDefault()});
  ['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,()=>{off();b.classList.remove('dn')}));}
hold('lft',()=>{bL=1;touch=bR-bL},()=>{bL=0;touch=bR-bL});
hold('rgt',()=>{bR=1;touch=bR-bL},()=>{bR=0;touch=bR-bL});
hold('gas',()=>{gasHold=1},()=>{gasHold=0});
hold('brk',()=>{brkHold=1},()=>{brkHold=0});
hold('hrn',()=>honk(),()=>{});
const sw=document.getElementById('sw');
const swAll=()=>[...sw.children];
function mark(){swAll().forEach((b,i)=>b.classList.toggle('on',i<PRE.length?PRE[i]===carCol:!PRE.includes(carCol)))}
function setCol(c){carCol=c.toLowerCase();try{localStorage.setItem('mag_col',carCol)}catch(e){}mark()}
PRE.forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label',T('color')+' '+(i+1));
  b.onclick=()=>setCol(c);sw.appendChild(b)});
const lb=document.createElement('label'),inp=document.createElement('input');
lb.className='cp';lb.title=T('mycolor');inp.type='color';inp.value=PRE.includes(carCol)?'#8a3cff':carCol;
inp.addEventListener('input',()=>setCol(inp.value));lb.appendChild(inp);sw.appendChild(lb);
mark();
addEventListener('blur',()=>{keyL=keyR=keyB=keyG=0;touch=0;brkHold=gasHold=0});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){pause();if(ac)ac.suspend()}
  else if(ac&&st!=='pause'&&!adBusy)ac.resume();
});

function help(){return T('help')}
/* ---------- Яндекс Игры SDK ---------- */
let ysdk=null,adBusy=false,gpOn=false;
function gp(on){
  if(!ysdk||!ysdk.features||!ysdk.features.GameplayAPI||gpOn===on)return;
  gpOn=on;try{on?ysdk.features.GameplayAPI.start():ysdk.features.GameplayAPI.stop()}catch(e){}
}
function showAd(next){
  let done=false;
  const fin=()=>{if(done)return;done=true;adBusy=false;if(ac&&!document.hidden)ac.resume();next()};
  adBusy=true;if(ac)ac.suspend();
  try{ysdk.adv.showFullscreenAdv({callbacks:{onOpen:()=>{},onClose:fin,onError:fin,onOffline:fin}})}catch(e){fin()}
}
function ysInit(){
  if(typeof YaGames==='undefined')return; // вне Яндекс Игр (GitHub Pages, локально) игра работает как раньше
  YaGames.init().then(y=>{
    ysdk=y;
    try{setLang(pickLang(y.environment.i18n.lang))}catch(e){}
    try{y.features.LoadingAPI&&y.features.LoadingAPI.ready()}catch(e){}
    try{
      y.on('game_api_pause',()=>{pause();if(ac)ac.suspend()});
      y.on('game_api_resume',()=>{if(ac&&!adBusy&&!document.hidden)ac.resume()});
    }catch(e){}
  }).catch(()=>{});
}

reset();fit();
function showMenu(){show(T('title'),T('intro')+'<br>'+help()+'<br><small style="opacity:.6">'+T('credits')+'</small>',T('start'))}
function applyLang(){
  document.documentElement.lang=LANG;document.title=T('title');
  sb.textContent=muted?T('off'):T('on');
  const al=(id,k)=>document.getElementById(id).setAttribute('aria-label',T(k));
  al('lft','left');al('rgt','right');al('hrn','horn');al('brk','brake');al('gas','gasA');
  document.getElementById('brk').textContent=T('brk');document.getElementById('gas').textContent=T('gas');
  swAll().forEach((b,i)=>{if(i<PRE.length)b.setAttribute('aria-label',T('color')+' '+(i+1))});
  lb.title=T('mycolor');
  if(st==='menu')showMenu();
}
function setLang(l){if(l!==LANG){LANG=l;applyLang()}}
applyLang();
requestAnimationFrame(loop);
ysInit();
</script>
