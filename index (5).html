<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Магистраль</title>
<style>
html,body{margin:0;height:100%;background:#101214;overflow:hidden;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#f1ede4;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#box{position:relative;font-size:16px}
canvas{display:block}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(10,12,14,.8);padding:1.5em;gap:.6em;box-sizing:border-box}
.ov.hide{display:none}
h1{margin:0;font-size:2.1em;font-style:italic;font-weight:800}
p{margin:0;opacity:.85;line-height:1.45;font-size:.95em;max-width:22em}
button{font:inherit;font-weight:700;font-size:1.1em;padding:.7em 2em;border:0;border-radius:.5em;background:#2f7bff;color:#fff;cursor:pointer;margin-top:.5em}
button:focus-visible{outline:3px solid #ffb27a;outline-offset:2px}
#snd{position:absolute;top:2.6em;right:.6em;font-size:.8em;padding:.4em .8em;margin:0;background:rgba(0,0,0,.5)}
.big{font-size:2.8em;font-weight:800;color:#ff8a2a}
.ov{background:rgba(10,12,14,.6)}
#sw{display:flex;gap:.7em;margin-top:.3em}
#sw button{width:2.2em;height:2.2em;padding:0;margin:0;border-radius:50%;border:3px solid transparent}
#sw button.on{border-color:#fff}
#brk,#gas{position:absolute;bottom:.6em;margin:0;padding:.7em 1.5em;font-size:.95em}
#brk{left:.6em;background:rgba(190,30,30,.85)}
#gas{right:.6em;background:rgba(30,150,70,.85)}
</style>
</head>
<body>
<div id="wrap"><div id="box">
<canvas id="c"></canvas>
<button id="snd">Звук: вкл</button>
<button id="brk">Тормоз</button>
<button id="gas">Газ</button>
<div class="ov" id="ov"><h1 id="ot"></h1><p id="op"></p><div id="sw"></div><button id="ob"></button></div>
</div></div>
<script src="assets/sounds.js"></script>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d'),box=document.getElementById('box'),
ov=document.getElementById('ov'),ot=document.getElementById('ot'),op=document.getElementById('op'),
ob=document.getElementById('ob'),sb=document.getElementById('snd');
const W=400,H=700,RX=40,LW=80,K=3,PY=570,FONT='"Segoe UI",Roboto,Arial,sans-serif';
const laneX=i=>RX+LW*i+LW/2;
const LV=[70,62,54,46]; // скорость потока по полосам, км/ч
const COL=['#c9c9c4','#8f2a2a','#d9b13b','#3f7a58','#d6d1c4','#6a5a9c','#2b2f36'];
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
let st='menu',speed,dist,bonus,cars,p,off,spawn,pops,shake,best=0,k=1,keyL=0,keyR=0,touch=0,last=0;
let ac,eo,fl,eg,muted=false,braking=false,keyB=0,brkHold=0,sid=-1,keyG=0,gasHold=0,cd=0,go=0;
const IMG=n=>{const i=new Image();i.src=n;return i};
const CARS=['#d11a1a','#2f6df0','#1fa05a','#f0b800','#e9e9e9','#1a1a1a'];
let ci=0;try{ci=+localStorage.getItem('mag_car')||0}catch(e){}
const carImg=CARS.map((c,i)=>IMG('assets/car'+i+'.png')),asphalt=IMG('assets/asphalt.jpg'),grass=IMG('assets/grass.jpg');
const ok=i=>i.complete&&i.naturalWidth>0;
const SPR={},TY={sedan:{w:40,h:90},suv:{w:42,h:98},truck:{w:44,h:132},fura:{w:46,h:210}};
const LIGHT=['#dfe2e6','#c9d2dc','#e8dfc8','#b7c6d6'];
function sh(c,f){const n=parseInt(c.slice(1),16),t=f<0?0:255,a=Math.abs(f),m=v=>Math.round(v+(t-v)*a);return 'rgb('+m(n>>16)+','+m(n>>8&255)+','+m(n&255)+')'}
function rp(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function sprite(type,col,cab,w,h){
  const key=type+col+cab;if(SPR[key])return SPR[key];
  const S=3,c=document.createElement('canvas');c.width=(w+10)*S;c.height=(h+10)*S;
  const g=c.getContext('2d');g.scale(S,S);g.translate((w+10)/2,(h+10)/2);
  const body=(x,y,a,b,r,cl)=>{const q=g.createLinearGradient(x,0,x+a,0);
    q.addColorStop(0,sh(cl,-.4));q.addColorStop(.3,sh(cl,.1));q.addColorStop(.55,sh(cl,.22));q.addColorStop(1,sh(cl,-.4));
    g.fillStyle=q;rp(g,x,y,a,b,r);g.fill()};
  const glass=(x,y,a,b,r)=>{const q=g.createLinearGradient(0,y,0,y+b);q.addColorStop(0,'#2a3744');q.addColorStop(1,'#0a0e13');
    g.fillStyle=q;rp(g,x,y,a,b,r);g.fill();g.fillStyle='rgba(255,255,255,.14)';
    g.beginPath();g.moveTo(x+2,y+b*.5);g.lineTo(x+a*.55,y+2);g.lineTo(x+a*.8,y+2);g.lineTo(x+2,y+b*.85);g.fill()};
  g.fillStyle='rgba(0,0,0,.4)';rp(g,-w/2+2,-h/2+4,w,h,8);g.fill();
  if(type==='truck'||type==='fura'){
    const cb=type==='fura'?h*.15:h*.24,top=-h/2,bt=top+cb+4;
    body(-w/2+1,top,w-2,cb,6,cab);glass(-w/2+5,top+4,w-10,cb*.4,3);
    g.fillStyle='#16181c';g.fillRect(-4,top+cb-1,8,6);
    body(-w/2,bt,w,h-cb-4,3,col);
    g.strokeStyle='rgba(0,0,0,.14)';g.lineWidth=.8;
    for(let y=bt+10;y<h/2-4;y+=13){g.beginPath();g.moveTo(-w/2+2,y);g.lineTo(w/2-2,y);g.stroke()}
    g.fillStyle='rgba(255,255,255,.22)';g.fillRect(-w/2+5,bt+3,w*.16,h-cb-12);
  }else{
    const sv=type==='suv';
    g.fillStyle='#0b0b0d';
    for(const y of[-h*.3,h*.25]){g.fillRect(-w/2-1.5,y,3.5,h*.15);g.fillRect(w/2-2,y,3.5,h*.15)}
    body(-w/2,-h/2,w,h,w*.3,col);
    g.strokeStyle='rgba(0,0,0,.22)';g.lineWidth=.7;g.beginPath();
    g.moveTo(-w*.2,-h/2+4);g.lineTo(-w*.22,-h*.2);g.moveTo(w*.2,-h/2+4);g.lineTo(w*.22,-h*.2);g.stroke();
    glass(-w/2+4,sv?-h*.2:-h*.17,w-8,sv?h*.56:h*.46,6);
    body(-w/2+6,sv?-h*.08:-h*.04,w-12,sv?h*.36:h*.22,4,col);
    g.fillStyle=sh(col,-.3);rp(g,-w/2-3.5,-h*.15,4.5,5,2);g.fill();rp(g,w/2-1,-h*.15,4.5,5,2);g.fill();
  }
  g.fillStyle='#fff7d0';rp(g,-w/2+3,-h/2+1.5,8,3.5,1.5);g.fill();rp(g,w/2-11,-h/2+1.5,8,3.5,1.5);g.fill();
  g.fillStyle='#ff2a22';rp(g,-w/2+3,h/2-4.5,9,3,1.5);g.fill();rp(g,w/2-12,h/2-4.5,9,3,1.5);g.fill();
  return SPR[key]=c;
}
function drawPlayer(){
  const im=carImg[ci],good=ok(im),PW=44,PH=good?PW*im.naturalHeight/im.naturalWidth:90;
  cx.save();cx.translate(p.x,p.y);cx.rotate(p.vx/270*.08);
  cx.fillStyle='rgba(0,0,0,.35)';rp(cx,-PW/2+3,-PH/2+5,PW-4,PH,10);cx.fill();
  if(good)cx.drawImage(im,-PW/2,-PH/2,PW,PH);
  else cx.drawImage(sprite('sedan',CARS[ci],CARS[ci],40,90),-25,-50,50,100);
  if(braking)for(const sx of[-1,1]){
    const gr=cx.createRadialGradient(sx*PW*.27,PH/2-3,0,sx*PW*.27,PH/2-3,10);
    gr.addColorStop(0,'rgba(255,60,40,.95)');gr.addColorStop(1,'rgba(255,40,30,0)');
    cx.fillStyle=gr;cx.fillRect(sx*PW*.27-10,PH/2-13,20,20);
  }
  cx.restore();
}
try{best=+localStorage.getItem('mag_best')||0}catch(e){}

const score=()=>Math.floor(dist/10)+bonus;
function reset(){speed=20;dist=0;bonus=0;cars=[];pops=[];off=0;spawn=.4;shake=0;p={x:laneX(1),y:PY,w:36,h:88,vx:0}}
function show(t,h,b){ot.textContent=t;op.innerHTML=h;ob.textContent=b;ov.classList.remove('hide');ob.focus({preventScroll:true})}
function fit(){
  const s=Math.min(innerWidth/W,innerHeight/H),dpr=Math.min(devicePixelRatio||1,2);
  box.style.width=W*s+'px';box.style.height=H*s+'px';box.style.fontSize=16*s+'px';
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';
  cv.width=W*s*dpr;cv.height=H*s*dpr;k=cv.width/W;
}
addEventListener('resize',fit);

/* ---------- звук ---------- */
function audioInit(){
  if(!ac){
    try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
    const o1=ac.createOscillator(),o2=ac.createOscillator();
    o1.type='sawtooth';o2.type='square';
    fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=600;
    eg=ac.createGain();eg.gain.value=0;
    o1.connect(fl);o2.connect(fl);fl.connect(eg).connect(ac.destination);
    o1.start();o2.start();eo=[o1,o2];loadSamples();
  }
  if(ac.state==='suspended')ac.resume();
}
let L=null;
function loadSamples(){
  if(typeof SND==='undefined')return;
  const K3=['idle','on','off'];
  const dec=k=>new Promise((res,rej)=>{const b=atob(SND[k]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);ac.decodeAudioData(u.buffer,res,rej)});
  Promise.all(K3.map(dec)).then(bs=>{
    const m=ac.createGain();m.connect(ac.destination);const o={m};
    K3.forEach((k,i)=>{const s=ac.createBufferSource(),g=ac.createGain();
      s.buffer=bs[i];s.loop=true;s.loopStart=.06;s.loopEnd=bs[i].duration-.06;g.gain.value=0;s.connect(g).connect(m);s.start();o[k]={s,g}});
    L=o;
  }).catch(()=>{});
}
function engine(){
  if(!ac)return;
  if(L){
    const t=ac.currentTime,live=(st==='play'||st==='count')&&!muted,gas=st==='play'&&(keyG||gasHold)&&!braking;
    const cl=v=>Math.max(0,Math.min(1,v)),k=speed/200,rt=.8+k*.75;
    eg.gain.setTargetAtTime(0,t,.05);
    L.idle.g.gain.setTargetAtTime(live?.9*cl(1-(speed-20)/35):0,t,.08);
    L.on.g.gain.setTargetAtTime(live&&gas?.8*(.35+.65*cl((speed-20)/30)):0,t,.08);
    L.off.g.gain.setTargetAtTime(live&&!gas?.65*cl((speed-20)/40):0,t,.12);
    L.idle.s.playbackRate.setTargetAtTime(.9+speed*.004,t,.1);
    L.on.s.playbackRate.setTargetAtTime(rt,t,.08);
    L.off.s.playbackRate.setTargetAtTime(rt,t,.1);
    return;
  }
  const g=Math.floor(speed/40),r=(speed%40)/40,f=62+r*92+g*7,t=ac.currentTime;
  eo[0].frequency.setTargetAtTime(f,t,.03);
  eo[1].frequency.setTargetAtTime(f/2,t,.03);
  fl.frequency.setTargetAtTime(420+r*900,t,.05);
  eg.gain.setTargetAtTime(!muted&&(st==='play'||st==='count')?.07:0,t,.05);
}
function beep(){
  if(!ac||muted)return;
  const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type='triangle';o.frequency.setValueAtTime(600,t);o.frequency.exponentialRampToValueAtTime(1100,t+.1);
  g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);
  o.connect(g).connect(ac.destination);o.start();o.stop(t+.13);
}
function crashSound(){
  if(!ac||muted)return;
  const n=ac.sampleRate*.6|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=b;f.type='lowpass';f.frequency.value=900;g.gain.value=.5;
  s.connect(f).connect(g).connect(ac.destination);s.start();
}
function toggleMute(){muted=!muted;sb.textContent=muted?'Звук: выкл':'Звук: вкл'}

/* ---------- логика ---------- */
function trySpawn(){
  if(cars.filter(c=>c.y<140).length>=2)return;
  const free=[0,1,2,3].filter(i=>!cars.some(c=>c.lane===i&&c.y<260)&&speed>LV[i]+10);
  if(!free.length)return;
  const lane=free[Math.random()*free.length|0],r=Math.random();
  const t=lane>=2&&r<.12?'fura':lane>=2&&r<.28?'truck':r<.55?'suv':'sedan',d={type:t,...TY[t]};
  const big=t==='fura'||t==='truck',pick=a=>a[Math.random()*a.length|0];
  cars.push({lane,v:LV[lane],x:laneX(lane)+(Math.random()*10-5),y:-d.h-20,pass:false,col:big?pick(LIGHT):pick(COL),cab:pick(COL),...d});
}
function pop(s){pops.push({t:1.1,s})}
function crash(){
  st='over';shake=calm?0:.45;crashSound();
  const sc=score();
  if(sc>best){best=sc;try{localStorage.setItem('mag_best',best)}catch(e){}}
  setTimeout(()=>{if(st==='over')show('Авария','Счёт <b class="big">'+sc+'</b><br>Рекорд: '+best,'Ещё раз')},700);
}
function update(dt){
  if(st==='count'){cd-=dt;speed=20;braking=false;if(cd<=0){st='play';go=.9}}
  else{braking=!!(keyB||brkHold);go-=dt;
    speed=braking?Math.max(20,speed-95*dt):(keyG||gasHold)?Math.min(200,speed+(45-speed*.17)*dt):Math.max(20,speed-(4+speed*.03)*dt)}
  off+=speed*K*dt;dist+=speed/3.6*dt;
  const dir=Math.max(-1,Math.min(1,(keyR|0)-(keyL|0)+touch));
  p.vx+=(dir*270-p.vx)*Math.min(1,9*dt);
  p.x=Math.max(RX+p.w/2+3,Math.min(RX+4*LW-p.w/2-3,p.x+p.vx*dt));
  spawn-=dt;
  if(spawn<=0){spawn=Math.max(.45,.95-(speed-120)/650)*(.7+Math.random()*.6);trySpawn()}
  for(const c of cars){
    c.y+=(speed-c.v)*K*dt;
    if(!c.pass&&c.y>p.y){
      c.pass=true;
      if(Math.abs(p.x-c.x)<(p.w+c.w)/2+14){bonus+=25;pop('Впритык +25');beep()}
    }
    if(Math.abs(p.x-c.x)<(p.w+c.w)/2-3&&Math.abs(p.y-c.y)<(p.h+c.h)/2-4){crash();return}
  }
  cars=cars.filter(c=>c.y<H+260&&c.y>-400);
  pops.forEach(o=>o.t-=dt);pops=pops.filter(o=>o.t>0);
}

/* ---------- рисование ---------- */
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function car(x,y,w,h,col,type,tilt){
  cx.save();cx.translate(x,y);if(tilt)cx.rotate(tilt);
  cx.fillStyle='rgba(0,0,0,.35)';rr(-w/2+3,-h/2+4,w,h,8);cx.fill();
  if(type==='truck'){
    cx.fillStyle=col;rr(-w/2,-h/2,w,h*.28,6);cx.fill();
    cx.fillStyle='#14181d';rr(-w/2+5,-h/2+7,w-10,h*.08,3);cx.fill();
    cx.fillStyle='#b9bcc0';rr(-w/2,-h/2+h*.3,w,h*.7,3);cx.fill();
    cx.fillStyle='rgba(0,0,0,.12)';cx.fillRect(-1,-h/2+h*.3,2,h*.7);
  }else{
    cx.fillStyle=col;rr(-w/2,-h/2,w,h,9);cx.fill();
    cx.fillStyle='#12161b';rr(-w/2+4,-h*.22,w-8,h*.5,6);cx.fill();
    cx.fillStyle=col;rr(-w/2+7,-h*.1,w-14,h*.28,4);cx.fill();
    if(type==='sport'){cx.fillStyle='rgba(255,255,255,.25)';cx.fillRect(-4,-h/2+3,2,h*.26);cx.fillRect(2,-h/2+3,2,h*.26)}
  }
  cx.fillStyle='#fff6c9';cx.fillRect(-w/2+3,-h/2+1,7,3);cx.fillRect(w/2-10,-h/2+1,7,3);
  cx.fillStyle='#ff3b30';cx.fillRect(-w/2+3,h/2-4,8,3);cx.fillRect(w/2-11,h/2-4,8,3);
  cx.restore();
}
function draw(){
  cx.setTransform(k,0,0,k,0,0);
  cx.fillStyle='#1b2d22';cx.fillRect(0,0,W,H);
  cx.save();
  if(shake>0)cx.translate((Math.random()-.5)*20*shake,(Math.random()-.5)*20*shake);
  const o=off%256;
  for(let y=-256+o;y<H;y+=256){
    if(ok(grass)){cx.drawImage(grass,0,y,256,256);cx.drawImage(grass,256,y,256,256)}
  }
  cx.save();cx.beginPath();cx.rect(RX,0,4*LW,H);cx.clip();
  cx.fillStyle='#2b2d31';cx.fillRect(RX,0,4*LW,H);
  if(ok(asphalt))for(let y=-256+o;y<H;y+=256){cx.drawImage(asphalt,RX,y,256,256);cx.drawImage(asphalt,RX+256,y,256,256)}
  cx.restore();
  cx.fillStyle='rgba(0,0,0,.3)';cx.fillRect(RX-6,0,6,H);cx.fillRect(RX+4*LW,0,6,H);
  cx.fillStyle='#d8d4c8';
  for(let y=-100+(off%100);y<H;y+=100){cx.fillRect(16,y,5,22);cx.fillRect(W-21,y,5,22)}
  cx.fillStyle='#e8e4d8';
  cx.fillRect(RX+4,0,3,H);cx.fillRect(RX+4*LW-7,0,3,H);
  for(let i=1;i<4;i++)for(let y=-80+(off%80);y<H;y+=80)cx.fillRect(RX+i*LW-1.5,y,3,40);
  cars.forEach(c=>cx.drawImage(sprite(c.type,c.col,c.cab,c.w,c.h),c.x-(c.w+10)/2,c.y-(c.h+10)/2,c.w+10,c.h+10));
  const g=cx.createLinearGradient(0,p.y-38,0,p.y-260);
  g.addColorStop(0,'rgba(255,246,201,.16)');g.addColorStop(1,'rgba(255,246,201,0)');
  cx.fillStyle=g;cx.beginPath();cx.moveTo(p.x-14,p.y-38);cx.lineTo(p.x+14,p.y-38);cx.lineTo(p.x+60,p.y-260);cx.lineTo(p.x-60,p.y-260);cx.fill();
  drawPlayer();
  cx.restore();
  cx.textAlign='left';cx.fillStyle='#f1ede4';cx.font='700 24px '+FONT;cx.fillText(score(),14,34);
  cx.font='italic 800 30px '+FONT;cx.textAlign='center';cx.fillText(Math.round(speed)+' км/ч',W/2,34);cx.textAlign='left';
  cx.font='600 13px '+FONT;
  cx.textAlign='right';cx.fillStyle='rgba(241,237,228,.65)';cx.fillText('Рекорд '+best,W-14,32);
  cx.textAlign='center';cx.font='800 22px '+FONT;
  for(const o of pops){cx.globalAlpha=Math.min(1,o.t*2);cx.fillStyle='#ff8a2a';cx.fillText(o.s,W/2,330-(1.1-o.t)*40)}
  cx.globalAlpha=1;
  if(st==='count'||go>0){
    const t=st==='count'?String(Math.ceil(cd)):'Старт!';
    cx.textAlign='center';cx.font='italic 800 96px '+FONT;cx.lineWidth=6;cx.strokeStyle='rgba(0,0,0,.5)';
    cx.strokeText(t,W/2,300);cx.fillStyle=st==='count'?'#f1ede4':'#ff8a2a';cx.fillText(t,W/2,300);
  }
}
function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(st==='play'||st==='count')update(dt);else if(st==='menu')off+=180*dt;
  if(shake>0)shake-=dt;
  engine();draw();requestAnimationFrame(loop);
}

/* ---------- управление ---------- */
function start(){reset();st='count';cd=3;ov.classList.add('hide')}
function pause(){if(st==='play'){st='pause';show('Пауза','Игра остановлена.','Продолжить')}}
ob.addEventListener('click',()=>{
  audioInit();
  if(st==='pause'){st='play';ov.classList.add('hide')}else start();
});
sb.addEventListener('click',toggleMute);
addEventListener('keydown',e=>{
  const c=e.code;
  if(c==='ArrowLeft'||c==='KeyA')keyL=1;
  else if(c==='ArrowRight'||c==='KeyD')keyR=1;
  else if(c==='ArrowUp'||c==='KeyW')keyG=1;
  else if(c==='ArrowDown'||c==='KeyS')keyB=1;
  else if(c==='KeyM')toggleMute();
  else if(c==='KeyP'||c==='Escape')pause();
  if(c.startsWith('Arrow'))e.preventDefault();
});
addEventListener('keyup',e=>{
  const c=e.code;
  if(c==='ArrowLeft'||c==='KeyA')keyL=0;
  else if(c==='ArrowRight'||c==='KeyD')keyR=0;
  else if(c==='ArrowUp'||c==='KeyW')keyG=0;
  else if(c==='ArrowDown'||c==='KeyS')keyB=0;
});
const side=e=>{const r=box.getBoundingClientRect();touch=(e.clientX-r.left)<r.width/2?-1:1};
box.addEventListener('pointerdown',e=>{if(e.target===cv){sid=e.pointerId;side(e)}});
box.addEventListener('pointermove',e=>{if(touch&&e.target===cv)side(e)});
['pointerup','pointercancel'].forEach(n=>addEventListener(n,e=>{if(e.pointerId===sid)touch=0}));
const bk=document.getElementById('brk');
bk.addEventListener('pointerdown',e=>{brkHold=1;e.preventDefault()});
['pointerup','pointercancel','pointerleave'].forEach(n=>bk.addEventListener(n,()=>{brkHold=0}));
const gb=document.getElementById('gas');
gb.addEventListener('pointerdown',e=>{gasHold=1;e.preventDefault()});
['pointerup','pointercancel','pointerleave'].forEach(n=>gb.addEventListener(n,()=>{gasHold=0}));
const sw=document.getElementById('sw');
function mark(){[...sw.children].forEach((b,i)=>b.classList.toggle('on',i===ci))}
CARS.forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label','Цвет '+(i+1));
  b.onclick=()=>{ci=i;try{localStorage.setItem('mag_car',i)}catch(e){}mark()};sw.appendChild(b)});
mark();
addEventListener('blur',()=>{keyL=keyR=keyB=keyG=0;touch=0;brkHold=gasHold=0});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){pause();if(ac)ac.suspend()}
  else if(ac&&st!=='pause')ac.resume();
});

reset();fit();
show('Магистраль','Обгоняйте поток и держитесь на дороге. Опасный обгон впритык даёт бонус.<br>Руль: ← → или A / D, газ: ↑ или W, тормоз: ↓ или S. На телефоне — касание левой или правой половины экрана и кнопки «Газ» и «Тормоз» внизу.','Старт');
requestAnimationFrame(loop);
</script>
</body>
</html>
